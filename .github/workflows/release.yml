# A release: push a tag v<major.minor.patch> equal to Directory.Build.props' Version.
#   build    refuses a tag that differs from the version, runs the tests, then dev\Publish.ps1:
#            dist\ControllerNavigation.exe (one self-contained file) and dist\update.json
#   publish  a GitHub release with those two files, notes from the tag's message. Made as a draft
#            and published once both files are up: installed copies read releases/latest, which
#            never points at a release without its update.json.
# Installed copies install whatever is published here (no code signing: TLS and the SHA-256 in
# update.json, docs/SPEC.md "Install and updates"). So the build has no write access at all, and
# only the short publishing job can write releases. Actions are pinned to commits.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: The tag matches the version
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          & .\dev\Publish.ps1 -Tag $env:TAG -CheckOnly

      - name: Tests
        shell: powershell
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet run -c Release --project tests\ControllerNavigation.Tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build the release files
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          & .\dev\Publish.ps1 -Tag $env:TAG

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/ControllerNavigation.exe
            dist/update.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      # checkout leaves a lightweight copy of the tag; the annotated tag carries the notes.
      - name: Publish the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git tag -l --format='%(contents)' $env:TAG | Out-File -Encoding utf8 "$env:RUNNER_TEMP\notes.txt"
          $manifest = Get-Content dist\update.json -Raw | ConvertFrom-Json
          if ("v$($manifest.version)" -cne $env:TAG) { throw "update.json is for $($manifest.version), not $env:TAG" }
          gh release create $env:TAG dist\ControllerNavigation.exe dist\update.json --draft --verify-tag --title "Controller Navigation $($manifest.version)" --notes-file "$env:RUNNER_TEMP\notes.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:TAG --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
