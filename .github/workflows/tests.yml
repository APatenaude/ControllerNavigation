# The checks (tests\ControllerNavigation.Tests, a console harness: exit code 0 only when every
# check passed), on every push to a branch. A release runs them again itself (release.yml).
name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Tests
        shell: powershell
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet run -c Release --project tests\ControllerNavigation.Tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
